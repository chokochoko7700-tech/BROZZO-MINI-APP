<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>BROZZO*</title>
<link rel="icon" href="/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://images.pexels.com">
<link rel="preconnect" href="https://sjrbonuivjznpazuwwhw.supabase.co">
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400&display=swap" onload="this.onload=null;this.rel='stylesheet'">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#f6f6f3;--card:#fff;--ink:#111;--mute:#8d8d87;--line:#e6e6e1;--soft:#f0f0ec;--y:#f2c200;--red:#e0322b;--nav:76px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg)}
body{font-family:Manrope,system-ui,-apple-system,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;padding-bottom:calc(var(--nav) + 24px + env(safe-area-inset-bottom));min-height:100vh}
button,input,textarea,select{font:inherit;color:inherit;border:0;background:none;outline:none}
button{cursor:pointer}
img{display:block}
svg{flex:none}
.hide{display:none!important}

/* top */
.top{position:sticky;top:0;z-index:20;background:rgba(246,246,243,.94);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);padding:10px 16px 12px;border-bottom:1px solid var(--line)}
.top .lg{width:34px;height:34px;border-radius:50%;margin:0 auto 10px;background:#fff center/cover;box-shadow:0 0 0 1px var(--line)}
.sbox{display:flex;align-items:center;gap:10px;height:50px;padding:0 16px;border:1px solid var(--line);border-radius:16px;background:#fafaf8}
.sbox input{flex:1;font-size:17px;min-width:0}
.sbox input::placeholder{color:var(--mute)}
.sbox .x{color:#fff;background:#b9b9b3;width:22px;height:22px;border-radius:50%;font-size:15px;line-height:22px;text-align:center;flex:none}
.srow{display:flex;align-items:center;gap:12px}
.srow .sbox{flex:1;min-width:0;transition:.2s}
input[type=search]::-webkit-search-cancel-button,input[type=search]::-webkit-search-decoration{-webkit-appearance:none;display:none}
.srow.focus .sbox{border-color:var(--ink);background:#fff}
.cancel{font-weight:600;font-size:16px;display:none;flex:none;padding:6px 0}
.srow.focus .cancel{display:block}
.recent{display:flex;align-items:center;gap:12px;width:100%;padding:14px 16px;text-align:left;font-size:17px;border-bottom:1px solid var(--line)}
.recent span{flex:1}
.recent svg{color:var(--mute)}
.sres{padding:0 16px}
.shit{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:10px 0;border-bottom:1px solid var(--line)}
.shit .im{width:58px;aspect-ratio:5/6;border-radius:12px;background:var(--soft) center/cover;flex:none}
.shit .tx{flex:1;min-width:0}
.shit b{display:block;font-weight:600;font-size:16px;line-height:1.3}
.shit b mark{background:#fff1a8;color:inherit;border-radius:3px}
.shit small{display:block;color:var(--mute);font-size:13px;margin-top:2px}
.shit .p{font-weight:800;font-size:16px;white-space:nowrap}

/* typography */
.h1{font-size:31px;font-weight:800;letter-spacing:-.025em;line-height:1.15;padding:22px 16px 16px}
.h2{font-size:26px;font-weight:800;letter-spacing:-.02em;padding:28px 16px 14px}
.h2.row{display:flex;justify-content:space-between;align-items:baseline}
.h2 small{font-size:15px;font-weight:600;color:var(--mute)}
.mute{color:var(--mute)}

/* marquee */
.mq{margin:0 16px;background:var(--ink);color:#fff;height:52px;overflow:hidden;display:flex;align-items:center}
.mq div{display:flex;white-space:nowrap;animation:mq 22s linear infinite;font-size:19px;font-weight:500}
.mq span{padding-right:48px}
@keyframes mq{to{transform:translateX(-50%)}}

/* stories */
.stories{display:flex;gap:14px;overflow-x:auto;padding:0 16px 4px;scrollbar-width:none}
.stories::-webkit-scrollbar,.banners::-webkit-scrollbar,.chips::-webkit-scrollbar,.gal::-webkit-scrollbar{display:none}
.st{flex:none;width:86px;text-align:center}
.st .ring{width:86px;height:86px;border-radius:50%;padding:3px;border:3px solid var(--ink)}
.st.seen .ring{border-color:#d4d4cf}
.st .ring div{width:100%;height:100%;border-radius:50%;background:var(--soft) center/cover}
.st b{display:block;font-size:14px;font-weight:500;margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st.seen b{color:var(--mute)}

/* banners */
.bwrap{position:relative;margin-top:22px}
.banners{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding:0 16px;scrollbar-width:none}
.banner{flex:none;width:100%;aspect-ratio:3/1;border-radius:22px;background:#111 center/cover;scroll-snap-align:center}
.dots{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);display:flex;gap:6px;background:rgba(0,0,0,.35);padding:7px 10px;border-radius:99px}
.dots i{width:8px;height:8px;border-radius:99px;background:rgba(255,255,255,.55);transition:.25s}
.dots i.on{width:24px;background:#fff}

/* chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding:0 16px 14px;scrollbar-width:none}
.chip{flex:none;height:40px;padding:0 16px;border-radius:99px;background:var(--card);border:1px solid var(--line);font-weight:600;font-size:15px}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}

/* product grid */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 16px}
.card{background:var(--card);border-radius:20px;overflow:hidden;display:flex;flex-direction:column}
.card .im{position:relative;aspect-ratio:5/6;background:var(--soft) center/cover}
.card .body{padding:14px 12px 12px;display:flex;flex-direction:column;flex:1}
.card .nm{font-size:16px;font-weight:500;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.6em}
.card .pr{font-size:19px;font-weight:800;margin:10px 0 12px;letter-spacing:-.01em}
.card .pr s{display:block;font-size:13px;font-weight:500;color:var(--mute);margin-bottom:1px}
.card .add{margin-top:auto}
.heart{position:absolute;right:10px;top:10px;width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.72);display:grid;place-items:center;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
iconify-icon,svg.si{display:inline-block;flex:none;vertical-align:middle}
[data-bg]{background-color:var(--soft)}
.heart.on{color:var(--red)}
.sale{position:absolute;left:10px;top:10px;background:var(--y);font-weight:800;font-size:13px;padding:5px 9px;border-radius:8px}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;height:48px;border-radius:14px;background:var(--ink);color:#fff;font-weight:700;font-size:16px}
.btn.lg{height:56px;font-size:17px;border-radius:16px}
.btn.ghost{background:var(--soft);color:var(--ink)}
.btn.line{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.sm{width:auto;height:38px;padding:0 14px;font-size:14px;border-radius:11px}
.btn:disabled{opacity:.5}
.btn.done{background:#2f2f2f}
.empty{text-align:center;color:var(--mute);padding:40px 24px;font-size:16px;grid-column:1/-1}
.empty svg{margin:0 auto 12px;display:block;opacity:.4}

/* category tiles */
.cats{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 16px}
.cat{position:relative;aspect-ratio:1/1;border-radius:20px;background:#222 center/cover;overflow:hidden;text-align:left}
.cat::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 40%,rgba(0,0,0,.65))}
.cat b{position:absolute;left:14px;bottom:12px;right:14px;z-index:1;color:#fff;font-size:19px;font-weight:700}
.cat small{display:block;font-size:13px;font-weight:500;opacity:.8}

/* product page */
.gal{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;background:var(--soft)}
.gal div{flex:none;width:100%;aspect-ratio:5/6;background:var(--soft) center/cover;scroll-snap-align:center}
.pinfo{background:var(--card);border-radius:24px 24px 0 0;margin-top:-22px;position:relative;padding:22px 16px 8px}
.pinfo h1{font-size:24px;font-weight:700;line-height:1.25;letter-spacing:-.01em}
.pinfo .pr{font-size:28px;font-weight:800;margin-top:10px;letter-spacing:-.02em}
.pinfo .pr s{font-size:17px;color:var(--mute);font-weight:500;margin-left:10px}
.stars{display:inline-flex;gap:2px;vertical-align:middle}
.rate{display:flex;align-items:center;gap:8px;margin-top:10px;color:var(--mute);font-size:15px}
.lbl{font-size:15px;font-weight:700;margin:22px 0 10px}
.sizes{display:flex;flex-wrap:wrap;gap:8px}
.sz{min-width:56px;height:46px;padding:0 14px;border-radius:13px;border:1.5px solid var(--line);font-weight:700;font-size:16px;background:var(--card)}
.sz.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.desc{font-size:16px;line-height:1.55;color:#333;white-space:pre-line}
.buy{position:fixed;left:0;right:0;bottom:calc(var(--nav) + env(safe-area-inset-bottom));padding:10px 16px;background:linear-gradient(transparent,var(--bg) 30%);z-index:15}
.rv{padding:14px 0;border-top:1px solid var(--line)}
.rv b{font-weight:700}
.rv p{margin-top:6px;font-size:15px;line-height:1.5;color:#333}
.rv small{color:var(--mute);font-size:13px}
.starpick{display:flex;gap:6px;margin:4px 0 10px}
.starpick button{padding:2px}

/* lists / profile */
.group{background:var(--card);border-radius:22px;margin:0 16px;overflow:hidden}
.li{display:flex;align-items:center;gap:16px;width:100%;padding:16px;text-align:left;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li .ic{width:54px;height:54px;border-radius:15px;background:var(--soft);display:grid;place-items:center;flex:none}
.li .tx{flex:1;min-width:0}
.li .tx b{display:block;font-size:19px;font-weight:500}
.li .tx small{display:block;color:var(--mute);font-size:15px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .chev{color:var(--mute)}
.user{display:flex;align-items:center;gap:14px;padding:0 16px 4px}
.user .av{width:62px;height:62px;border-radius:50%;background:var(--ink) center/cover;color:#fff;display:grid;place-items:center;font-size:24px;font-weight:800}
.user b{font-size:20px;font-weight:700;display:block}
.logout{display:block;width:calc(100% - 32px);margin:28px 16px 0;height:64px;border-radius:22px;background:var(--card);color:var(--red);font-size:19px;font-weight:700;border:1px solid var(--line)}
.ver{text-align:center;font-family:'JetBrains Mono',monospace;color:var(--mute);font-size:14px;padding:30px 0 10px}

/* cart */
.ci{display:flex;gap:12px;padding:12px;background:var(--card);border-radius:20px;margin:0 16px 10px}
.ci .im{width:86px;aspect-ratio:5/6;border-radius:14px;background:var(--soft) center/cover;flex:none}
.ci .tx{flex:1;min-width:0;display:flex;flex-direction:column}
.ci .tx b{font-size:15px;font-weight:600;line-height:1.3}
.ci .tx small{color:var(--mute);font-size:13px;margin-top:3px}
.ci .tx .p{font-weight:800;font-size:17px;margin-top:auto}
.qty{display:flex;align-items:center;gap:6px;margin-top:8px}
.qty button{width:34px;height:34px;border-radius:10px;background:var(--soft);font-size:19px;font-weight:700}
.qty span{min-width:26px;text-align:center;font-weight:700}
.sum{background:var(--card);border-radius:22px;margin:6px 16px 0;padding:18px 16px}
.sum div{display:flex;justify-content:space-between;padding:4px 0;font-size:16px}
.sum .t{font-size:21px;font-weight:800;padding-top:10px;margin-top:6px;border-top:1px solid var(--line)}

/* forms */
.form{padding:0 16px;display:grid;gap:12px}
.fld label{display:block;font-size:14px;font-weight:600;color:var(--mute);margin:0 0 6px 4px}
.fld input,.fld textarea,.fld select{width:100%;padding:15px 16px;border-radius:15px;background:var(--card);border:1px solid var(--line);font-size:17px}
.fld input:focus,.fld textarea:focus,.fld select:focus{border-color:var(--ink)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--soft);padding:5px;border-radius:16px}
.seg button{height:46px;border-radius:12px;font-weight:700;font-size:15px;color:var(--mute)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.08)}
.addr{display:flex;align-items:center;gap:12px;padding:14px 16px;background:var(--card);border:1.5px solid var(--line);border-radius:16px;text-align:left;width:100%}
.addr.on{border-color:var(--ink)}
.addr .tx{flex:1;min-width:0}
.addr b{display:block;font-weight:700}
.addr small{display:block;color:var(--mute);font-size:14px;margin-top:2px}
.radio{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);flex:none}
.addr.on .radio{border:7px solid var(--ink)}
#map{height:300px;border-radius:18px;background:var(--soft);overflow:hidden}
.order{background:var(--card);border-radius:20px;margin:0 16px 10px;padding:16px}
.order .hd{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:17px}
.order small{display:block;color:var(--mute);font-size:14px;margin-top:4px}
.order .thumbs{display:flex;gap:6px;margin:12px 0 4px;overflow-x:auto}
.order .thumbs div{width:52px;aspect-ratio:5/6;border-radius:10px;background:var(--soft) center/cover;flex:none}
.badge{font-size:13px;font-weight:700;padding:5px 10px;border-radius:99px;background:var(--soft)}
.badge.new{background:var(--y)}.badge.confirmed{background:#dbeafe}.badge.done{background:#dcfce7}.badge.cancel{background:#fee2e2}
.socials{display:flex;gap:12px;margin:22px 0}
.socials button{width:58px;height:58px;border-radius:16px;display:grid;place-items:center}
.brand{padding:24px 16px 0}
.brand .lg{width:84px;height:84px;border-radius:50%;background:#fff center/cover;box-shadow:0 0 0 1px var(--line)}
.brand p{font-size:18px;line-height:1.6;color:#444;margin-top:22px}
.copy{color:var(--mute);font-size:15px;padding:22px 16px 0;border-top:1px solid var(--line);margin:28px 16px 0}

/* nav */
nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-radius:28px 28px 0 0;box-shadow:0 -2px 18px rgba(0,0,0,.06);display:flex;padding:10px 4px calc(10px + env(safe-area-inset-bottom))}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;color:var(--mute);font-size:15px;font-weight:500;position:relative}
nav button.on{color:var(--ink)}
nav .cnt{position:absolute;top:-4px;left:calc(50% + 8px);background:var(--ink);color:#fff;font-size:12px;font-weight:700;min-width:20px;height:20px;border-radius:99px;display:grid;place-items:center;padding:0 5px;border:2px solid #fff}

/* floating help */

/* story viewer */
#sv{position:fixed;inset:0;background:#000;z-index:60;display:none}
#sv.on{display:block}
#santa{position:fixed;left:0;top:0;width:30px;height:34px;pointer-events:none;z-index:25;opacity:0;transition:opacity .5s;will-change:transform}
#santa.on{opacity:1}#santa i{display:block;width:100%;height:100%;transform-origin:50% 100%}
#santa .shadow{position:absolute;left:5px;right:5px;bottom:-2px;height:4px;border-radius:50%;background:rgba(0,0,0,.18);filter:blur(1px)}
#sv .img{position:absolute;inset:0;background:#000 center/cover no-repeat;transition:background-image .15s}
#sv .sh{position:absolute;left:0;right:0;z-index:1;pointer-events:none}
#sv .sh.t{top:0;height:calc(210px + var(--st,0px));background:linear-gradient(180deg,rgba(0,0,0,.88) 0%,rgba(0,0,0,.62) 38%,rgba(0,0,0,.22) 72%,rgba(0,0,0,0) 100%)}
#sv .sh.b{bottom:0;height:calc(280px + env(safe-area-inset-bottom));background:linear-gradient(0deg,rgba(0,0,0,.9) 0%,rgba(0,0,0,.62) 38%,rgba(0,0,0,.22) 72%,rgba(0,0,0,0) 100%)}
#sv .bars{position:absolute;top:calc(12px + env(safe-area-inset-top));left:10px;right:10px;display:flex;gap:4px;z-index:2}
#sv .bars i{flex:1;height:3px;border-radius:3px;background:rgba(255,255,255,.35);overflow:hidden}
#sv .bars i b{display:block;height:100%;width:0;background:#fff}
#sv .hd{position:absolute;top:calc(26px + env(safe-area-inset-top));left:14px;right:14px;display:flex;align-items:center;gap:10px;color:#fff;font-weight:700;z-index:2}
#sv .hd .c{width:36px;height:36px;border-radius:50%;background:center/cover}
#sv .hd .x{margin-left:auto;font-size:30px;color:#fff;line-height:1;padding:4px 8px}

/* sheet */
#sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:none;align-items:flex-end}
#sheet.on{display:flex}
#sheet .in{background:var(--bg);width:100%;border-radius:26px 26px 0 0;padding:10px 0 calc(20px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}
#sheet .grab{width:44px;height:5px;border-radius:9px;background:#d0d0cb;margin:0 auto 10px}

/* admin */
.tabs{display:flex;gap:6px;overflow-x:auto;padding:0 16px 14px;scrollbar-width:none}
.thumbs-edit{display:flex;flex-wrap:wrap;gap:8px}
.thumbs-edit div{position:relative;width:72px;aspect-ratio:5/6;border-radius:12px;background:var(--soft) center/cover}
.thumbs-edit div button{position:absolute;top:-6px;right:-6px;width:24px;height:24px;border-radius:50%;background:var(--ink);color:#fff;font-size:14px;line-height:1}
.upl{width:72px;aspect-ratio:5/6;border-radius:12px;border:1.5px dashed #bdbdb7;display:flex;align-items:center;justify-content:center;color:var(--mute);font-size:28px;position:relative;overflow:hidden}
.upl input{position:absolute;inset:0;opacity:0}
.arow{display:flex;gap:12px;align-items:center;background:var(--card);border-radius:18px;padding:10px;margin:0 16px 8px}
.arow .im{width:56px;aspect-ratio:5/6;border-radius:12px;background:var(--soft) center/cover;flex:none}
.arow .tx{flex:1;min-width:0;font-size:15px;font-weight:600}
.arow .tx small{display:block;color:var(--mute);font-weight:500}
.toast{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top));transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:14px;font-weight:600;z-index:80;font-size:15px;transition:.3s;opacity:0;pointer-events:none}
.toast.on{opacity:1}
.skel{background:linear-gradient(90deg,#ececE8,#f6f6f3,#ececE8);background-size:200% 100%;animation:sk 1.2s infinite}
@keyframes sk{to{background-position:-200% 0}}

/* ===== ixcham o'lchamlar (One23 bilan bir xil) ===== */
:root{--nav:62px}
body{font-size:15px}
.top{padding:8px 16px 10px}
.top .lg{width:26px;height:26px;margin-bottom:8px}
.sbox{height:42px;border-radius:14px;padding:0 14px;gap:8px}
.sbox input{font-size:16px}
.cancel{font-size:15px}
.h1{font-size:24px;padding:18px 16px 12px;letter-spacing:-.02em}
.h2{font-size:21px;padding:22px 16px 12px}
.h2 small{font-size:13px}
.mq{height:42px}
.mq div{font-size:15px}
.st{width:76px}
.st .ring{width:76px;height:76px;border-width:2.5px;padding:3px}
.st b{font-size:13px;margin-top:6px}
.stories{gap:12px}
.bwrap{margin-top:18px}
.banner{border-radius:18px}
.dots{bottom:10px;padding:6px 9px}
.dots i{width:6px;height:6px}.dots i.on{width:18px}
.chip{height:34px;padding:0 13px;font-size:14px}
.grid{gap:10px}
.card{border-radius:16px}
.card .body{padding:10px 10px 10px}
.card .nm{font-size:14px;line-height:1.3}
.card .pr{font-size:16px;margin:6px 0 10px}
.card .pr s{font-size:12px}
.heart{width:34px;height:34px;right:8px;top:8px}
.sale{font-size:12px;padding:4px 7px}
.btn{height:40px;border-radius:12px;font-size:14px;gap:6px}
.btn.lg{height:50px;font-size:16px;border-radius:14px}
.btn.sm{height:34px;font-size:13px;padding:0 12px}
.empty{font-size:15px;padding:32px 24px}
.cats{gap:10px}
.cat{border-radius:16px}
.cat b{font-size:17px;left:12px;bottom:10px}
.cat small{font-size:12px}
.pinfo{padding:18px 16px 8px;border-radius:20px 20px 0 0}
.pinfo h1{font-size:20px}
.pinfo .pr{font-size:23px;margin-top:8px}

const cloud = tg.CloudStorage && tg.isVersionAtLeast?.('6.9') ? tg.CloudStorage : null;
const store = {
  get(k) { return new Promise(res => {
    let local = null; try { local = JSON.parse(localStorage.getItem('bz_' + k)); } catch {}
    if (!cloud) return res(local);
    cloud.getItem(k, (e, v) => { if (e || !v) return res(local); try { res(JSON.parse(v)); } catch { res(local); } });
  }); },
  set(k, v) { const s = JSON.stringify(v); try { localStorage.setItem('bz_' + k, s); } catch {} if (cloud && s.length < 4000) cloud.setItem(k, s, () => {}); },
  del(k) { try { localStorage.removeItem('bz_' + k); } catch {} cloud?.removeItem(k, () => {}); },
};

/* ===== router ===== */
const TABS = ['home', 'catalog', 'cart', 'profile', 'admin'];
let stack = [{ v: 'home' }];
const cur = () => stack[stack.length - 1];
function go(v, p = {}) {
  if (TABS.includes(v) && !Object.keys(p).length) stack = [{ v }]; else stack.push({ v, ...p });
  endSearch(true);
  render(); window.scrollTo(0, 0);
}
function back() { if (searching) { endSearch(); return render(); } if (stack.length > 1) { stack.pop(); render(); window.scrollTo(0, 0); } }
tg.BackButton.onClick(back);

/* qidiruv: katta-kichik harf, o'/o‘/o`, kirill↔lotin, x↔h farqi yo'q; so'zlar istalgan tartibda */
const CYR = { а: 'a', б: 'b', в: 'v', г: 'g', д: 'd', е: 'e', ё: 'yo', ж: 'j', з: 'z', и: 'i', й: 'y', к: 'k', л: 'l', м: 'm', н: 'n', о: 'o', п: 'p', р: 'r', с: 's', т: 't', у: 'u', ф: 'f', х: 'x', ц: 's', ч: 'ch', ш: 'sh', щ: 'sh', ъ: '', ы: 'i', ь: '', э: 'e', ю: 'yu', я: 'ya', ў: 'o', қ: 'q', ғ: 'g', ҳ: 'h' };
const norm = s => String(s || '').toLowerCase().replace(/[а-яёўқғҳ]/g, c => CYR[c] ?? c).replace(/[‘’ʻʼ`´']/g, '').replace(/x/g, 'h').replace(/[^a-z0-9 ]+/g, ' ').replace(/\s+/g, ' ').trim();
function searchList(raw) {
  const words = norm(raw).split(' ').filter(Boolean); if (!words.length) return [];
  const cat = Object.fromEntries(D.categories.map(c => [c.id, c.name]));
  return D.products.map(p => {
    const name = norm(p.name), hay = name + ' ' + norm(cat[p.category_id]) + ' ' + norm(p.description) + ' ' + norm((p.sizes || []).join(' '));
    if (!words.every(w => hay.includes(w))) return null;
    const score = (name.startsWith(words[0]) ? 0 : name.split(' ').some(t => t.startsWith(words[0])) ? 1 : 2);
    return { p, score };
  }).filter(Boolean).sort((a, b) => a.score - b.score).map(x => x.p);
}
function mark(name, raw) {
  const w = raw.trim().split(/\s+/).filter(x => x.length > 1).map(x => x.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'));
  const h = esc(name); if (!w.length) return h;
  try { return h.replace(new RegExp('(' + w.join('|') + ')', 'gi'), '<mark>$1</mark>'); } catch { return h; }
}

  "1C'da: <b>Администрирование → Обмен данными → Обмен с сайтами</b> (УТ / Розница / УНФ'da \"Обмен с сайтом\") ni oching va yoqing",

const readInteg = () => {
  const c = AD.ig?.cfg; if (!c) return;
  for (const [k] of IOPT) if ($('io_' + k)) c[k] = $('io_' + k).checked;
  const v = id => $(id) ? $(id).value.trim() : undefined;
  [['ig_int', 'interval'], ['ig_btok', 'billz_token'], ['ig_login', 'onec_login'], ['ig_pass', 'onec_password'], ['ig_ptype', 'onec_price_type'], ['ig_url', 'api_url'], ['ig_atok', 'api_token'], ['ig_hdr', 'api_header']]
    .forEach(([id, k]) => { const x = v(id); if (x !== undefined) c[k] = x; });
  if ($('ig_shop')) { c.billz_shop_id = $('ig_shop').value; c.billz_shop_name = $('ig_shop').selectedOptions[0]?.textContent || ''; }
  if ($('ix_hide')) AD.ixHide = $('ix_hide').checked;

  const t = c.type, last = logs[0];
  const auto = t === 'billz' || (t === 'yespos' && c.yespos_mode === 'api');
  const cnt = Object.values(linked || {}).reduce((a, b) => a + b, 0);
  let h = `<div class="icard"><div class="ist"><span class="dot ${t === 'none' ? 'off' : last && !last.ok ? 'err' : ''}"></span>${t === 'none' ? "Integratsiya o'chiq" : ITYPES[t] + ' ulangan'}</div>

  h += `<div class="h2" style="font-size:17px">Hisob dasturi</div><div class="chips">${Object.entries(ITYPES).map(([k, n]) => `<button class="chip ${t === k ? 'on' : ''}" data-itype="${k}">${n}</button>`).join('')}</div><div class="form">`;
  if (t === 'none') h += `<p class="mute" style="font-size:14px">Do'kon qaysi dasturda ishlasa, o'shani tanlang — narx va qoldiqlar botga o'zi tushadi:</p>

  if (t === 'excel') h += xlsBox("Ombor/kassa dasturidan (1C, BILLZ, YesPOS, Regos, Optimo...) tovarlar qoldig'ini Excel'ga chiqaring va shu yerga yuklang. Mavjud tovarlar artikul, shtrix-kod yoki nomi bo'yicha topilib yangilanadi.");
  if (t === 'onec') h += `<div class="group" style="padding:14px;display:grid;gap:10px"><b>1C'ni ulash (5 daqiqa)</b><ol class="steps">${ONEC_STEPS.map(x => `<li>${x}</li>`).join('')}</ol>
    ${copyBtn(onec_url, 'Сайт адреси')}${c.onec_login ? copyBtn(c.onec_login, 'Логин') + copyBtn(c.onec_password, 'Пароль') : `<p class="mute" style="font-size:13px">Login va parol "Saqlash"dan keyin avtomatik yaratiladi.</p>`}</div>

  }
  if (auto) h += `<div class="fld"><label>Yangilash oralig'i (daqiqa)</label><input id="ig_int" inputmode="numeric" value="${esc(c.interval)}"></div>`;

  h += `<button class="btn lg" id="ig_save">Saqlash</button></div>`;

  return h + '<div style="height:20px"></div>';
}
async function previewImport(file) {
  if (file.size > 12 * 1024 * 1024) return tg.showAlert('Fayl juda katta (12 MB gacha)');
  readInteg(); toast("Fayl o'qilmoqda...");
  const data = await new Promise((ok, no) => { const r = new FileReader(); r.onload = () => ok(r.result); r.onerror = no; r.readAsDataURL(file); });
  const body = { data, name: file.name, hide_missing: !!AD.ixHide };
  let r; try { r = await api('/admin/import', { method: 'POST', body: JSON.stringify({ ...body, dry: true }) }); } catch (e) { return tg.showAlert(e.message); }
  AD.ix = body;
  sheet(`<div class="h2" style="padding-top:4px">Yuklashdan oldin tekshiring</div><div class="form">
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><div class="pv"><span class="n">${r.added}</span>yangi tovar</div><div class="pv"><span class="n">${r.updated}</span>yangilanadi</div>
    <div class="pv"><span class="n">${r.unchanged}</span>o'zgarishsiz</div><div class="pv"><span class="n">${r.hidden}</span>yashiriladi</div></div>
    ${r.skipped ? `<p class="mute" style="font-size:13px">${r.skipped} ta qator o'tkazib yuboriladi (narxi yo'q yoki qoldig'i 0 bo'lgan yangi tovar).</p>` : ''}
    ${r.new_categories?.length ? `<p class="mute" style="font-size:13px">Yangi kategoriyalar: <b>${r.new_categories.map(esc).join(', ')}</b></p>` : ''}
    ${(r.sample || []).map(x => `<div class="ilog"><div><b>${x.act === 'new' ? '🆕' : '🔄'} ${esc(x.name)}</b><br><span class="mute">${som(x.price)}${x.qty != null ? ' · qoldiq ' + x.qty : ''}${x.sizes?.length ? ' · ' + esc(x.sizes.join(', ')) : ''}</span></div></div>`).join('')}
    <button class="btn lg" id="ix_go">Tasdiqlash va yuklash</button><button class="btn ghost" id="ix_no">Bekor qilish</button></div>`);
}

/* ===== map ===== */
function withMaps(fn) {
  if (window.ymaps) return ymaps.ready(fn);
  if (!yKey) { const m = $('map'); if (m) m.style.display = 'none'; return; }
  const s = document.createElement('script');
  s.src = `https://api-maps.yandex.ru/2.1/?apikey=${encodeURIComponent(yKey)}&lang=uz_UZ`;
  s.onload = () => ymaps.ready(fn); document.head.appendChild(s);
}
function mapPicker(el, st) {
  withMaps(() => {
    if (!$(el)) return;
    const center = st.loc ? [st.loc.lat, st.loc.lng] : SHOP.coords;
    const m = new ymaps.Map(el, { center, zoom: 15, controls: ['zoomControl', 'geolocationControl'] });
    const pm = new ymaps.Placemark(center, {}, { preset: 'islands#blackDotIcon', draggable: true });
    m.geoObjects.add(pm);
    const set = c => { pm.geometry.setCoordinates(c); m.setCenter(c, Math.max(m.getZoom(), 16)); st.loc = { lat: c[0], lng: c[1] };
      ymaps.geocode(c, { results: 1 }).then(r => { const g = r.geoObjects.get(0); if (g && $('f_addr')) { $('f_addr').value = g.getAddressLine(); st.text = $('f_addr').value; } }).catch(() => {}); };
    m.events.add('click', e => set(e.get('coords')));
    pm.events.add('dragend', () => set(pm.geometry.getCoordinates()));
    m.controls.get('geolocationControl').events.add('locationchange', e => set(e.get('position')));
    MP = { set };
  });
}
let MP = null;
// Joriy joylashuv: avval Telegram LocationManager, bo'lmasa brauzer geolokatsiyasi
function getLocation() {
  return new Promise((ok, no) => {
    const lm = tg.LocationManager;
    const browser = () => navigator.geolocation ? navigator.geolocation.getCurrentPosition(p => ok([p.coords.latitude, p.coords.longitude]), e => no(e), { enableHighAccuracy: true, timeout: 15000, maximumAge: 60000 }) : no(new Error('no geo'));
    if (lm && tg.isVersionAtLeast?.('8.0')) {
      const ask = () => lm.isLocationAvailable ? lm.getLocation(d => d ? ok([d.latitude, d.longitude]) : (lm.isAccessRequested && !lm.isAccessGranted ? no(new Error('denied')) : browser())) : browser();
      lm.isInited ? ask() : lm.init(ask);
    } else browser();
  });
}
async function useMyLocation(btn) {

/* ===== image upload ===== */
async function compress(file, max = 1400) {
  const url = URL.createObjectURL(file);
  const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
  const k = Math.min(1, max / Math.max(img.width, img.height));
  const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
  let d = c.toDataURL('image/webp', 0.82);
  if (!d.startsWith('data:image/webp')) d = c.toDataURL('image/jpeg', 0.84);
  return d;
}
async function uploadFiles(files) {
  const out = [];
  for (const f of files) { toast(`Yuklanmoqda ${out.length + 1}/${files.length}...`); out.push((await api('/admin/upload', { method: 'POST', body: JSON.stringify({ data: await compress(f) }) })).url); }
  toast('Yuklandi ✓'); return out;
}

/* ===== banner kesish: 3:1 ramkada oldindan ko'rish, surish va kattalashtirish ===== */
let CR = null;
function openCrop(file, rw, rh, outW, productId) {
  const url = URL.createObjectURL(file);
  sheet(`<div class="h2" style="padding-top:4px">Bannerni joylashtiring</div>
  <div class="form"><p class="mute" style="font-size:13px">Rasmni barmoq bilan suring, pastdagi polzunok bilan kattalashtiring. Ramka ichidagisi bosh sahifada aynan shunday ko'rinadi.</p>
  <div class="crop" id="crop" style="aspect-ratio:${rw}/${rh}"><img id="cimg" alt="" draggable="false"></div>
  <input type="range" id="czoom" min="1" max="3" step="0.01" value="1" class="zoom">
  <button class="btn lg" id="csave">Saqlash</button><button class="btn ghost" id="ccancel">Bekor qilish</button></div>`);
  const img = $('cimg'), box = $('crop');
  img.onload = () => {
    const W = box.clientWidth, H = box.clientHeight;
    CR = { img, url, W, H, nw: img.naturalWidth, nh: img.naturalHeight, z: 1, x: 0, y: 0, outW, outH: Math.round(outW * rh / rw), productId };
    CR.s0 = Math.max(W / CR.nw, H / CR.nh);
    CR.x = (W - CR.nw * CR.s0) / 2; CR.y = (H - CR.nh * CR.s0) / 2;
    drawCrop();
  };
  img.src = url;
  let drag = null;
  box.onpointerdown = e => { if (!CR) return; drag = { px: e.clientX, py: e.clientY, x: CR.x, y: CR.y }; box.setPointerCapture(e.pointerId); };
  box.onpointermove = e => { if (!drag) return; CR.x = drag.x + e.clientX - drag.px; CR.y = drag.y + e.clientY - drag.py; drawCrop(); };
  box.onpointerup = box.onpointercancel = () => { drag = null; };
  $('czoom').oninput = e => {
    if (!CR) return; const s1 = CR.s0 * CR.z, z = +e.target.value, s2 = CR.s0 * z;
    const cx = CR.W / 2, cy = CR.H / 2; // markaz atrofida kattalashtirish
    CR.x = cx - (cx - CR.x) * s2 / s1; CR.y = cy - (cy - CR.y) * s2 / s1; CR.z = z; drawCrop();
  };
}
function drawCrop() {
  const s = CR.s0 * CR.z, w = CR.nw * s, h = CR.nh * s;
  CR.x = Math.min(0, Math.max(CR.W - w, CR.x)); CR.y = Math.min(0, Math.max(CR.H - h, CR.y)); // bo'sh joy qolmasin
  Object.assign(CR.img.style, { width: w + 'px', height: h + 'px', transform: `translate(${CR.x}px,${CR.y}px)` });
}
async function saveCrop(btn) {
  if (!CR) return; btn.disabled = true; btn.textContent = tr('Yuklanmoqda...');
  try {
    const s = CR.s0 * CR.z, c = document.createElement('canvas'); c.width = CR.outW; c.height = CR.outH;
    const ctx = c.getContext('2d'); ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(CR.img, -CR.x / s, -CR.y / s, CR.W / s, CR.H / s, 0, 0, CR.outW, CR.outH);
    let d = c.toDataURL('image/webp', 0.86); if (!d.startsWith('data:image/webp')) d = c.toDataURL('image/jpeg', 0.86);
    const { url } = await api('/admin/upload', { method: 'POST', body: JSON.stringify({ data: d }) });
    await api('/admin/banners', { method: 'POST', body: JSON.stringify({ image: url, product_id: CR.productId }) });
    URL.revokeObjectURL(CR.url); CR = null; closeSheet(); await load(); render(); toast("Banner qo'shildi ✓");
  } catch (err) { tg.showAlert(err.message); btn.disabled = false; btn.textContent = tr('Saqlash'); }
}

  if (d.delb) return del('/admin/banners/' + d.delb, "Banner o'chirilsinmi?");
  if (d.dels) return del('/admin/stories/' + d.dels, "Istoriya o'chirilsinmi?");
  if (d.delc) return del('/admin/categories/' + d.delc, "Kategoriya o'chirilsinmi? Mahsulotlar o'chmaydi.");
  if (d.rmbc) { AD.bc.image = null; return render(); }
  if (t.id === 'bc_send') {
    const text = $('bc_text').value.trim(); if (!text && !AD.bc.image) return toast('Matn yoki rasm kiriting');
    return tg.showConfirm('Xabar barcha mijozlarga yuborilsinmi?', async ok => { if (!ok) return;
      try { await api('/admin/broadcast', { method: 'POST', body: JSON.stringify({ text, image: AD.bc.image, product_id: $('bc_prod').value }) }); AD.bc = { image: null }; toast('Yuborish boshlandi ✓'); render(); } catch (err) { tg.showAlert(err.message); } });
  }
  if (t.id === 'st_save') {
    const body = { admins: $('st_admins').value.split(/[,\s]+/).filter(Boolean), notify_chat: $('st_chat').value.trim(), delivery_fee: $('st_fee').value.replace(/\s/g, ''), free_from: $('st_free').value.replace(/\s/g, ''), santa: $('st_santa').checked };
    try { const r = await api('/admin/settings', { method: 'PUT', body: JSON.stringify(body) }); CFG.delivery_fee = +r.delivery_fee || 0; CFG.free_from = +r.free_from || 0; CFG.santa = r.santa !== false; toast('Saqlandi ✓'); render(); } catch (err) { tg.showAlert(err.message); }
    return;
  }
  if (t.id === 's_save') {
    const title = $('s_title').value.trim(); if (!title || !AD.story.images.length) return toast('Nom va rasm kerak');
    try { await api('/admin/stories', { method: 'POST', body: JSON.stringify({ title, images: AD.story.images, product_id: $('s_prod').value }) }); AD.story = { images: [] }; await load(); render(); toast("Qo'shildi ✓"); } catch (err) { tg.showAlert(err.message); }
    return;
  }
  if (t.id === 'c_save') {
    const name = $('c_name').value.trim(); if (!name) return;
    try { await api('/admin/categories', { method: 'POST', body: JSON.stringify({ name, sort: D.categories.length + 1 }) }); await load(); render(); toast("Qo'shildi ✓"); } catch (err) { tg.showAlert(err.message); }
  }
});

document.addEventListener('change', async e => {
  const el = e.target;
  if (el.dataset.sold) {
    const p = prod(el.dataset.sold); const sold = !el.checked;
    try { await api('/admin/products/' + p.id + '/flags', { method: 'PATCH', body: JSON.stringify({ sold_out: sold }) }); p.sold_out = sold; el.closest('.swl').querySelector('small').textContent = tr(sold ? "Yo'q" : 'Sotuvda'); toast(sold ? "Sotuvda yo'q deb belgilandi" : 'Sotuvga qaytarildi'); haptic(); }
    catch (err) { el.checked = !el.checked; tg.showAlert(err.message); }
    return;
  }
  if (el.dataset.cname) {
    const name = el.value.trim(); const c = D.categories.find(x => x.id === +el.dataset.cname); if (!name || !c || c.name === name) return;
    try { await api('/admin/categories/' + c.id, { method: 'PATCH', body: JSON.stringify({ name }) }); c.name = name; toast('Saqlandi ✓'); } catch (err) { tg.showAlert(err.message); }
    return;
  }
  const k = e.target.dataset.upload; if (!k || !e.target.files.length) return;
  const files = [...e.target.files].slice(0, 10);
  try {
    if (k === 'product') { saveProductForm(); AD.form.images.push(...await uploadFiles(files)); }
    if (k === 'story') AD.story.images.push(...await uploadFiles(files));
    if (k === 'bc') { const [url] = await uploadFiles(files.slice(0, 1)); AD.bc.image = url; }
    if (k === 'banner') { e.target.value = ''; return openCrop(files[0], 3, 1, 1500, $('b_prod').value); }
    if (k === 'xls') { e.target.value = ''; return previewImport(files[0]); }
    render();
  } catch (err) { tg.showAlert(err.message); }
});

function saveProductForm() {
  if (!$('p_name') || !AD.form) return;
  const extra = $('p_extra').value.split(',').map(x => x.trim()).filter(Boolean);
  const order = SIZE_SETS.flat();
  const preset = AD.form.sizes.filter(z => PRESET.has(z)).sort((a, b) => order.indexOf(a) - order.indexOf(b));
  Object.assign(AD.form, { name: $('p_name').value.trim(), price: $('p_price').value.replace(/\s/g, ''), old_price: $('p_old').value.replace(/\s/g, ''),
    sizes: [...preset, ...extra.filter(z => !preset.includes(z))], description: $('p_desc').value.trim(), sold_out: !$('p_sold').checked, sku: $('p_sku').value.trim(), barcode: $('p_bar').value.trim() });
}
function saveCheckoutFields() {
  const c = cur();
  if ($('f_name')) U.profile.name = $('f_name').value.trim();
  if ($('f_phone')) U.profile.phone = $('f_phone').value.trim();
  if ($('f_addr')) c.text = $('f_addr').value;
  if ($('f_agree')) c.agree = $('f_agree').checked;
}
async function placeOrder(btn) {
  saveCheckoutFields();
  const c = cur(); const name = U.profile.name, phone = U.profile.phone || '';
  if (!name || phone.replace(/\D/g, '').length < 9) return tg.showAlert('Ism va telefon raqamini kiriting');
  let address = '', loc = null;
  if (c.delivery === 'delivery') {
    if (c.addr >= 0 && U.addrs[c.addr]) { address = U.addrs[c.addr].text; loc = U.addrs[c.addr].loc; }
    else { address = (c.text || '').trim(); loc = c.loc || null;
      if (address && $('f_save')?.checked) { U.addrs.push({ title: 'Manzil ' + (U.addrs.length + 1), text: address, loc }); store.set('addrs', U.addrs); } }
    if (!address) return tg.showAlert('Yetkazish manzilini kiriting');
  }
  if (!c.agree) return tg.showAlert("Shartlarga rozilik belgisini qo'ying");
  store.set('profile', U.profile);
  btn.disabled = true; btn.textContent = 'Yuborilmoqda...';
  try {
    const r = await api('/orders', { method: 'POST', body: JSON.stringify({ name, phone, delivery: c.delivery, address, location: loc, comment: $('f_cmt')?.value || '', items: cart, agree: true }) });
    cart = []; saveCart(); tg.HapticFeedback?.notificationOccurred('success');
    stack = [{ v: 'profile' }, { v: 'orders' }]; render();
    tg.showAlert(`Buyurtma #${r.id} qabul qilindi! Tez orada siz bilan bog'lanamiz.`);
  } catch (err) { tg.showAlert(err.message); btn.disabled = false; btn.textContent = 'Buyurtma berish'; }
}

/* search */
let searching = false, sT;
const showSearch = () => { $('main').innerHTML = V.search(); $('buy').innerHTML = ''; };
function startSearch() {
  if (searching) return; searching = true;
  $('srow').classList.add('focus'); tg.BackButton.show();
  showSearch(); window.scrollTo(0, 0);
}
function endSearch(silent) {
  searching = false; q = ''; $('q').value = ''; $('qx').classList.add('hide');
  $('srow').classList.remove('focus'); $('q').blur();

}
function saveRecent(s) {
  s = String(s || '').trim(); if (s.length < 2) return;
  U.recent = [s, ...(U.recent || []).filter(x => x.toLowerCase() !== s.toLowerCase())].slice(0, 8); store.set('recent', U.recent);
}
$('q').addEventListener('focus', startSearch);
$('q').addEventListener('input', e => {
  q = e.target.value; $('qx').classList.toggle('hide', !q);
  clearTimeout(sT); sT = setTimeout(() => { showSearch(); window.scrollTo(0, 0); }, 120);

$('q').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); saveRecent(q); $('q').blur(); } });
$('qx').addEventListener('pointerdown', e => e.preventDefault()); // klaviatura yopilmasin
$('qx').onclick = () => { q = ''; $('q').value = ''; $('qx').classList.add('hide'); showSearch(); $('q').focus(); };
$('qc').onclick = () => { endSearch(); render(); };
// natijalarni aylantirganda klaviatura yopiladi
document.addEventListener('input', e => {
  const el = e.target;
  if (el.id === 'ap_q') { AD.pq = el.value; $('aplist').innerHTML = aplist(); return; }
  if (el.classList.contains('num')) { const pos = el.value.length - el.selectionStart; el.value = fmtNum(el.value); try { el.setSelectionRange(el.value.length - pos, el.value.length - pos); } catch {} }
});
$('main').addEventListener('touchmove', () => { if (searching && document.activeElement === $('q')) $('q').blur(); }, { passive: true });

/* ===== render ===== */
function navBar() {
  const root = stack[0].v, n = cartCount();
  const items = [['home', I.home, I.homeOn, 'Bosh sahifa'], ['catalog', I.grid, I.gridOn, 'Katalog'], ['cart', I.cart(), I.cartOn, 'Savat'], ['profile', I.user, I.userOn, 'Profil']];
  if (isAdmin) items.push(['admin', ic('shield-user-linear', 24), ic('shield-user-bold', 24), 'Admin']);
  $('nav').innerHTML = items.map(([v, i0, i1, t]) => { const c = v === 'cart' ? n : v === 'admin' ? ADM.newOrders : 0;
    return `<button data-tab="${v}" class="${root === v ? 'on' : ''}">${root === v ? i1 : i0}${t}${c ? `<span class="cnt">${c}</span>` : ''}</button>`; }).join('');
}
let rid = 0;
/* ===== YANGI YIL: kichkina Santa yozuv, bo'lim va ikonkalar ustida sakrab yuradi (2-yanvargacha) ===== */
const SANTA_SVG = `<svg viewBox="0 0 30 34" width="30" height="34"><path d="M8 13 Q11 2 21 4 Q26 5 27 10 L22 9 Q18 7 15 13Z" fill="#d62828"/><circle cx="27" cy="11" r="2.4" fill="#fff"/><rect x="6.5" y="11.5" width="17" height="3.6" rx="1.8" fill="#fff"/>
<circle cx="15" cy="17.5" r="5" fill="#f6c9a8"/><circle cx="13" cy="16.8" r=".8" fill="#222"/><circle cx="17" cy="16.8" r=".8" fill="#222"/><circle cx="15" cy="18.3" r="1" fill="#e98b7a"/>
<path d="M9.5 18.5 Q10 25 15 25.5 Q20 25 20.5 18.5 Q18 21.5 15 20.6 Q12 21.5 9.5 18.5Z" fill="#fff"/>
<path d="M8 23 Q15 21 22 23 L23 30 L7 30Z" fill="#d62828"/><rect x="7" y="26" width="16" height="2.4" fill="#222"/><rect x="13.6" y="25.7" width="2.8" height="3" rx=".5" fill="none" stroke="#f2c200" stroke-width=".9"/>
<rect x="8" y="30" width="5.5" height="3.6" rx="1.5" fill="#222"/><rect x="16.5" y="30" width="5.5" height="3.6" rx="1.5" fill="#222"/></svg>`;
// Noyabr, dekabr va 1–2 yanvar; 3-yanvardan o'zi o'chadi
const isHoliday = () => { const d = new Date(), m = d.getMonth(); return m === 10 || m === 11 || (m === 0 && d.getDate() <= 2); };
const SANTA = { on: false, el: null, tgt: null, ox: 0, x: -40, y: 0, dir: 1, hop: null, rest: 0, raf: 0, land: 0 };
const SANTA_VIEWS = ['home', 'catalog', 'cat', 'profile', 'favs'];
function santaTargets() {
  const sel = '#main .h1, #main .h2, #main .hcat, #main .st .ring, #main .card .im, #main .li .ic, #nav button';
  return [...document.querySelectorAll(sel)].filter(e => { const r = santaRect(e); return r.width > 24 && r.top > 110 && r.top < innerHeight - 60 && r.left > -5 && r.right < innerWidth + 5; });
}
function santaPick() {
  const list = santaTargets().filter(e => e !== SANTA.tgt);
  if (!list.length) return null;
  // yaqinroq nishonlar ko'proq tanlanadi — sakrashlar tabiiy ko'rinadi
  const near = list.map(e => { const r = santaRect(e); return [e, Math.hypot(r.left + r.width / 2 - SANTA.x, r.top - SANTA.y)]; }).sort((a, b) => a[1] - b[1]);
  return near[Math.floor(Math.random() * Math.min(4, near.length))][0];
}
// Sarlavhalarda — harflarning o'zi ustiga (padding hisobga olinmaydi)
const SR = document.createRange();
function santaRect(e) {
  if (e.matches('.h1, .h2')) { SR.selectNodeContents(e.firstChild?.nodeType === 3 ? e.firstChild : e); const r = SR.getClientRects()[0]; if (r) return { left: r.left, top: r.top + 3, width: r.width }; }
  return e.getBoundingClientRect();
}
const santaPos = (e, ox) => { const r = santaRect(e); return [r.left + Math.min(Math.max(ox, 2), Math.max(2, r.width - 32)), r.top - 33]; };
function santaJump(now) {
  const t = santaPick(); if (!t) { SANTA.rest = now + 800; return; }
  const r = santaRect(t), ox = 4 + Math.random() * Math.max(0, r.width - 40);
  const [tx, ty] = santaPos(t, ox), d = Math.hypot(tx - SANTA.x, ty - SANTA.y);
  SANTA.hop = { t, ox, fx: SANTA.x, fy: SANTA.y, t0: now, dur: Math.min(1100, 450 + d * 1.3), h: Math.min(140, 40 + d * .35) };
  if (Math.abs(tx - SANTA.x) > 4) SANTA.dir = tx > SANTA.x ? 1 : -1;
}
function santaTick(now) {
  if (!SANTA.on) return;
  let sq = 1;
  if (SANTA.hop) {
    const h = SANTA.hop, k = Math.min(1, (now - h.t0) / h.dur);
    if (!h.t.isConnected) { SANTA.hop = null; SANTA.tgt = null; santaJump(now); }
    else {
      const [tx, ty] = santaPos(h.t, h.ox), e = k < .5 ? 2 * k * k : 1 - (-2 * k + 2) ** 2 / 2;
      SANTA.x = h.fx + (tx - h.fx) * e; SANTA.y = h.fy + (ty - h.fy) * k - Math.sin(Math.PI * k) * h.h;
      if (k < .12) sq = 1 - k * 1.5; // sakrashdan oldin cho'kadi
      if (k >= 1) { SANTA.tgt = h.t; SANTA.ox = h.ox; SANTA.hop = null; SANTA.land = now; SANTA.rest = now + 1300 + Math.random() * 2200; }
    }
  } else if (SANTA.tgt && SANTA.tgt.isConnected) {
    [SANTA.x, SANTA.y] = santaPos(SANTA.tgt, SANTA.ox);
    const r = santaRect(SANTA.tgt);
    if (r.top < 60 || r.top > innerHeight - 50) SANTA.rest = 0; // aylantirilganda ekrandan chiqsa — boshqa joyga sakraydi
    const since = now - SANTA.land; if (since < 220) sq = 1 - Math.sin(since / 220 * Math.PI) * .18; // qo'nish
    if (now > SANTA.rest) santaJump(now);
  } else if (now > SANTA.rest) {
    if (!SANTA.tgt) { SANTA.x = Math.random() < .5 ? -40 : innerWidth + 10; SANTA.y = innerHeight * .45; }
    SANTA.tgt = null; santaJump(now);
  }
  SANTA.el.style.transform = `translate(${SANTA.x}px,${SANTA.y}px)`;
  SANTA.el.lastChild.style.transform = `scaleX(${SANTA.dir * (1 + (1 - sq) * .6)}) scaleY(${sq})`;
  SANTA.raf = requestAnimationFrame(santaTick);
}
function santaSync() {
  const el = $('santa'); if (!el) return;
  const want = CFG.santa !== false && isHoliday() && SANTA_VIEWS.includes(cur().v) && !searching && !document.hidden && !matchMedia('(prefers-reduced-motion: reduce)').matches;
  el.classList.toggle('on', want);
  if (want && !SANTA.on) {
    SANTA.on = true; SANTA.el = el; if (!el.lastChild.innerHTML) el.lastChild.innerHTML = SANTA_SVG;
    SANTA.tgt = null; SANTA.hop = null; SANTA.rest = performance.now() + 900; SANTA.raf = requestAnimationFrame(santaTick);
  } else if (!want && SANTA.on) { SANTA.on = false; cancelAnimationFrame(SANTA.raf); }
  else if (want && SANTA.tgt && !SANTA.tgt.isConnected) { SANTA.tgt = null; SANTA.rest = performance.now() + 400; } // sahifa almashdi
}
document.addEventListener('visibilitychange', santaSync);

async function render() {
  const c = cur(), my = ++rid, v = V[c.v];
  setTimeout(santaSync, 60);
  if (searching) { navBar(); return showSearch(); }
  stack.length > 1 || searching ? tg.BackButton.show() : tg.BackButton.hide();
  navBar();
  $('top').classList.toggle('hide', c.v === 'product' || c.v === 'admin');
  document.body.classList.toggle('notop', c.v === 'product' || c.v === 'admin');
  MP = null;
  const html = await v(c);
  if (my !== rid) return;
  $('main').innerHTML = html;
  $('buy').innerHTML = v.buy ? v.buy(c) : '';
  v.after?.(c);
}

/* ===== avtomatik yangilanish: yangi versiya chiqsa ilova o'zi qayta yuklanadi ===== */
let APP_VER = null, verT = 0;
async function checkVersion() {
  if (!APP_VER || Date.now() - verT < 30000) return; verT = Date.now();
  try {
    const c = await api('/config');
    if (c.ver && c.ver !== APP_VER) {
      const busy = cur().v === 'checkout' || cur().v === 'admin' || searching;
      if (busy) return; // buyurtma yoki admin ishida xalaqit bermaymiz
      location.reload();
    }
  } catch {}
}
document.addEventListener('visibilitychange', () => { if (!document.hidden) { checkVersion(); refreshAdminBadge(); } });
try { tg.onEvent?.('activated', checkVersion); } catch {}
setInterval(checkVersion, 5 * 60 * 1000);

/* ===== boot ===== */
async function load() {
  const c = await api('/catalog'); D = c;
  cart = cart.filter(i => prod(i.id)); loaded = true;
}
(async () => {
  $('sicon').outerHTML = ic('magnifer-linear', 19, 'color:#8d8d87');
  if (window.__CAT) { D = window.__CAT; loaded = true; cart = cart.filter(i => prod(i.id)); } // katalog sahifa bilan birga keldi — darhol ko'rsatamiz
  navBar(); render();
  const [fav, profile, addrs, seen, recent] = await Promise.all(['fav', 'profile', 'addrs', 'seen', 'recent'].map(k => store.get(k)));
  U = { fav: fav || [], profile: profile || {}, addrs: addrs || [], seen: seen || [], recent: recent || [] };
  api('/config').then(c => { yKey = c.yandexKey; APP_VER = c.ver; CFG = { delivery_fee: +c.delivery_fee || 0, free_from: +c.free_from || 0, santa: c.santa !== false }; if (loaded) render(); }).catch(() => {});
  try {
    const [me] = await Promise.all([api('/me'), loaded ? null : load()]);
    isAdmin = me.isAdmin; if (isAdmin) refreshAdminBadge();
  } catch (e) {
    $('main').innerHTML = `<div class="empty">${I.box}${esc(e.message)}<br><br><button class="btn" style="max-width:220px;margin:0 auto" onclick="location.reload()">Qayta urinish</button></div>`;
    return;
  }
  const sp = tg.initDataUnsafe?.start_param; // t.me/bot/app?startapp=p_12 → mahsulot
  const pp = new URLSearchParams(location.search).get('p'); // rassilka havolasi → mahsulot
  if (sp && /^p_\d+$/.test(sp)) stack.push({ v: 'product', id: +sp.slice(2) });
  else if (pp && /^\d+$/.test(pp) && prod(pp)) stack.push({ v: 'product', id: +pp });
  render();
})();
